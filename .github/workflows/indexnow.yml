# PLATS: /.github/workflows/indexnow.yml  (SPEC 233: IndexNow-ping vid varje push)
name: IndexNow-ping
on:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: indexnow
  cancel-in-progress: true
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Anmäl ändrade sidor till IndexNow (Bing m.fl.)
        run: python3 .github/workflows/indexnow.py
