# ============================================================
# PLATS: /.github/workflows/autofix-recept.yml  (EXAKT denna sökväg krävs av GitHub Actions)
# ============================================================
# AUTO-KONVERTERARE – Mitt Maskinkök
# ============================================================
# Körs vid varje uppladdning till recept/ eller json/maskiner/.
# KONVERTERAR alla recept-HTML till appens standard:
#
#   1) site.js-raden        → läggs till om den saknas
#   2) PLATS-märkning       → läggs till på rad 2
#   3) METADATA             → GENERERAS automatiskt om den saknas:
#        recept:namn        ur <title> eller första <h1>
#        recept:emoji       ur titeln/rubriken (första emojin)
#        recept:beskrivning ur första stycket/underrubriken
#        recept:taggar      ur rubriker + kända matord i texten
#        recept:maskiner    MATCHAS mot maskindatabasen (json/maskiner/)
#                           – hittas "Clatronic"/"BBA 3774" i texten
#                           kopplas rätt maskin + program automatiskt
#   4) ENERGIDATA           → hittas "maskin + X min" i texten läggs
#                             receptet in i json/energi.json
#   5) Gamla modulrader     → städas (site.js sköter allt)
#   6) maskiner-index.json  → byggs om
#
# Resultatet committas automatiskt. Ladda upp VILKEN recept-HTML
# som helst → ~30 sek senare är den i appens standard!
# ============================================================
name: Auto-konvertera recept

on:
  push:
    paths:
      - 'recept/**.html'
      - 'json/maskiner/**.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Konvertera recept till appens standard
        run: |
          python3 << 'EOF'
          import glob, re, json, os, html as H

          SNIPPET = '<script src="../assets/site.js"></script>'

          # ---------- Ladda maskindatabasen för matchning ----------
          machines = []
          for mf in sorted(glob.glob('json/maskiner/*.json')):
              try:
                  m = json.load(open(mf, encoding='utf-8'))
                  machines.append(m)
              except Exception:
                  pass

          def find_machines(text):
              """Matcha maskiner som nämns i texten → (maskin, program, min)"""
              tl = text.lower()
              hits = []
              for m in machines:
                  names = [m.get('modellnamn',''), m.get('varumarke','')]
                  matched = any(n and n.lower() in tl for n in names if len(n) > 3)
                  if not matched:
                      continue
                  # Försök hitta program + tid nära maskinnamnet
                  prog, mins = None, None
                  for p in m.get('program', []):
                      pn = p['namn'].split('(')[0].strip().lower()
                      if len(pn) > 3 and pn in tl:
                          prog = p['namn']
                          break
                  tm = re.search(r'(\d+)\s*(?:min|minuter)', text)
                  if tm:
                      mins = int(tm.group(1))
                  hits.append((m, prog, mins))
              return hits

          MATORD = ['kaka','bröd','deg','pizza','glass','slush','soppa','gryta','kyckling',
                    'fisk','ris','pasta','sallad','shake','smoothie','chips','snacks',
                    'efterrätt','frukost','fika','protein','vegetarisk','airfryer','drink']

          def gen_meta(t, fname):
              """Generera saknad metadata ur innehållet."""
              added = []
              def has(n): return ('name="recept:%s"' % n) in t

              title_m = re.search(r'<title>(.*?)</title>', t, re.S)
              h1_m = re.search(r'<h1[^>]*>(.*?)</h1>', t, re.S)
              raw_title = (title_m.group(1) if title_m else (h1_m.group(1) if h1_m else fname))
              clean = re.sub(r'<[^>]+>', '', raw_title)
              clean = re.sub(r'\s*[–-]\s*Recept.*$', '', clean).strip()

              # Emoji ur titeln
              em = re.findall(r'[\U0001F300-\U0001FAFF\u2600-\u27BF]', clean)
              emoji = em[0] if em else '🍽️'
              namn = re.sub(r'[\U0001F300-\U0001FAFF\u2600-\u27BF]\s*', '', clean).strip() or fname

              # Beskrivning: första <p> eller header-underrubrik
              desc = ''
              pm = re.search(r'<header[^>]*>.*?<p[^>]*>(.*?)</p>', t, re.S)
              if not pm:
                  pm = re.search(r'<p[^>]*>(.*?)</p>', t, re.S)
              if pm:
                  desc = re.sub(r'<[^>]+>', '', pm.group(1)).strip()[:160]

              # Taggar: matord som förekommer i texten
              plain = re.sub(r'<[^>]+>', ' ', t).lower()
              tags = [w for w in MATORD if w in plain][:6]

              # Maskiner
              mhits = find_machines(plain)
              mask_meta = ' | '.join(
                  ('Tillagning: %s %s · %s%s' % (
                      m.get('varumarke',''), m.get('modellnamn',''),
                      (prog or 'se recept'),
                      (' ' + str(mins) + ' min' if mins else '')
                  )).strip()
                  for m, prog, mins in mhits[:3])

              metas = []
              if not has('namn'): metas.append(('namn', namn)); added.append('namn')
              if not has('emoji'): metas.append(('emoji', emoji)); added.append('emoji')
              if not has('beskrivning') and desc: metas.append(('beskrivning', desc)); added.append('beskrivning')
              if not has('taggar') and tags: metas.append(('taggar', ', '.join(tags))); added.append('taggar')
              if not has('maskiner') and mask_meta: metas.append(('maskiner', mask_meta)); added.append('maskiner')

              if metas:
                  block = '\n'.join('<meta name="recept:%s" content="%s">' % (n, H.escape(v, quote=True)) for n, v in metas)
                  if '</title>' in t:
                      t = t.replace('</title>', '</title>\n' + block, 1)
                  elif '<head>' in t:
                      t = t.replace('<head>', '<head>\n' + block, 1)
              return t, added, [(m, prog, mins) for m, prog, mins in mhits]

          # ---------- Energidata ----------
          energi_path = 'json/energi.json'
          try:
              energi = json.load(open(energi_path, encoding='utf-8'))
          except Exception:
              energi = {'_plats': '/json/energi.json  (central energidata per recept)', 'recept': {}}
          energi.setdefault('recept', {})

          # ---------- Konvertera alla recept ----------
          changed = []
          for f in sorted(glob.glob('recept/*.html')):
              fname = os.path.basename(f)
              t = open(f, encoding='utf-8').read()
              orig = t

              # 1) site.js
              if 'assets/site.js' not in t:
                  t = t.replace('</body>', SNIPPET + '\n</body>', 1) if '</body>' in t else t.rstrip() + '\n' + SNIPPET + '\n'

              # 2) PLATS
              if 'PLATS:' not in t[:400]:
                  t = t.replace('<!DOCTYPE html>',
                      '<!DOCTYPE html>\n<!-- PLATS: /recept/%s  (recept-mappen – läses in automatiskt) -->' % fname, 1)

              # 3) Metadata + maskinmatchning
              t, added_meta, mhits = gen_meta(t, fname.replace('.html',''))

              # 4) Energidata (om receptet saknas där och maskin+tid hittades)
              if fname not in energi['recept'] and mhits:
                  rows = []
                  for m, prog, mins in mhits[:3]:
                      if mins:
                          rows.append({'maskin': m['id'], 'min': mins,
                                       'moment': (prog or 'Tillagning').split('(')[0].strip()})
                  if rows:
                      energi['recept'][fname] = rows
                      added_meta.append('energi.json')

              # 5) Städa gamla modulrader
              for mod in ['print.js','app.js','recept.js','energi.js']:
                  t = re.sub(r'<script src="\.\./assets/' + mod + r'"></script>\n?', '', t)

              if t != orig or added_meta:
                  open(f, 'w', encoding='utf-8').write(t)
                  if t != orig or added_meta:
                      changed.append('%s (%s)' % (fname, ', '.join(added_meta) if added_meta else 'städad'))

          json.dump(energi, open(energi_path, 'w', encoding='utf-8'), ensure_ascii=False, indent=1)

          # 6) maskiner-index
          idx = sorted(os.path.basename(x) for x in glob.glob('json/maskiner/*.json'))
          json.dump(idx, open('json/maskiner-index.json','w'), ensure_ascii=False, indent=1)

          print('=== KONVERTERADE ===')
          for c in changed: print(' -', c)
          if not changed: print(' (alla recept redan i standard)')
          EOF

      - name: Committa
        run: |
          git config user.name "maskinkok-konverterare"
          git config user.email "actions@users.noreply.github.com"
          git add recept/ json/
          git diff --cached --quiet && echo "Inga ändringar." || (git commit -m "Auto-konvertering: recept till appens standard" && git push)
