# ============================================================
# PLATS: /.github/workflows/autofix-recept.yml  (EXAKT denna sökväg krävs av GitHub Actions)
# ============================================================
# AUTO-KONVERTERARE v3 – Mitt Maskinkök
# ============================================================
# Nya recept BYGGS OM HELT till sajtens standardutformning
# (samma design som befintliga recept – endast emoji skiljer):
#
#   STANDARDSTRUKTUR som allt konverteras till:
#     header (standardgradient röd→orange) + maskin-chips
#     → hero-bild (images/recept/FILNAMN.jpg)
#     → 🧾 Ingredienser (tabell) → 🥣 maskinsteg-ruta + <ol>-steg
#     → 📊 Näringsvärde → footer → site.js
#
#   Innehållet EXTRAHERAS ur originalfilen: tabeller, listor,
#   stycken, metadata. Maskiner matchas mot databasen (alias:
#   "airfryer" -> cosori osv). Energidata skapas i json/energi.json.
#
#   Filer som REDAN är i standard (mk-std-markör eller ser ut
#   som standarden) rörs inte.
# ============================================================
name: Auto-konvertera recept

on:
  push:
    paths:
      - 'recept/**.html'
      - 'recept/**.txt'
      - 'json/maskiner/**.json'
      - 'json/ingrediens-lankar.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Konvertera nya recept till standardutformningen
        run: python3 .github/workflows/konvertera.py

      - name: Hamta ingredienser fran produktlankar (Willys/Hemkop)
        run: python3 .github/workflows/ingrediens-import.py

      - name: Committa
        run: |
          git config user.name "maskinkok-konverterare"
          git config user.email "actions@users.noreply.github.com"
          git add recept/ json/
          if git diff --cached --quiet; then echo "Inga ändringar."; exit 0; fi
          git commit -m "Auto-konvertering: nya recept till standardutformningen"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push-krock (försök $i) – hämtar om, kör om roboten mot färska main..."
            git fetch origin main
            git reset --hard origin/main
            python3 .github/workflows/konvertera.py
            python3 .github/workflows/ingrediens-import.py || true
            git add recept/ json/
            if git diff --cached --quiet; then echo "Inget nytt efter omkörning."; exit 0; fi
            git commit -m "Auto-konvertering: nya recept till standardutformningen"
            sleep 5
          done
          echo "Gav upp efter 3 försök – nästa trigger tar det."; exit 1
