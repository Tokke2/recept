# ============================================================
# PLATS: /.github/workflows/autofix-recept.yml  (EXAKT denna sökväg krävs av GitHub Actions)
# ============================================================
# AUTO-KONVERTERARE v3 – Mitt Maskinkök
# ============================================================
# Nya recept BYGGS OM HELT till sajtens standardutformning
# (samma design som befintliga recept – endast emoji skiljer):
#
#   STANDARDSTRUKTUR som allt konverteras till:
#     header (standardgradient röd→orange) + maskin-chips
#     → hero-bild (images/recept/FILNAMN.jpg)
#     → 🧾 Ingredienser (tabell) → 🥣 maskinsteg-ruta + <ol>-steg
#     → 📊 Näringsvärde → footer → site.js
#
#   Innehållet EXTRAHERAS ur originalfilen: tabeller, listor,
#   stycken, metadata. Maskiner matchas mot databasen (alias:
#   "airfryer" -> cosori osv). Energidata skapas i json/energi.json.
#
#   Filer som REDAN är i standard (mk-std-markör eller ser ut
#   som standarden) rörs inte.
# ============================================================
name: Auto-konvertera recept

on:
  push:
    paths:
      - 'recept/**.html'
      - 'json/maskiner/**.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Konvertera nya recept till standardutformningen
        run: python3 .github/workflows/konvertera.py

      - name: Committa
        run: |
          git config user.name "maskinkok-konverterare"
          git config user.email "actions@users.noreply.github.com"
          git add recept/ json/
          git diff --cached --quiet && echo "Inga ändringar." || (git commit -m "Auto-konvertering: nya recept till standardutformningen" && git push)
