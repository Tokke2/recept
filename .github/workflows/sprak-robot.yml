# ============================================================
# PLATS: /.github/workflows/sprak-robot.yml  (EXAKT denna sökväg krävs av GitHub Actions)
# ============================================================
# 🌐 SPRÅKROBOT – Mitt Maskinkök
# ============================================================
# Förgenererar ALLA översättningar till json/sprak/*.json →
# språkbytet på sajten blir OMEDELBART (ren ordboksuppslagning,
# ingen väntan på Google i webbläsaren).
# Triggas: varje natt 03:30 UTC + när recept/maskiner/sidor
# ändras + manuellt. Rör ALDRIG befintliga/handrättade fraser –
# lägger endast till nya.
# ============================================================
name: Språkrobot (förgenerera översättningar)

on:
  schedule:
    - cron: '30 3 * * *'
  push:
    paths:
      - 'recept/**.html'
      - 'json/maskiner/**.json'
      - 'json/ingredienser.json'
      - '*.html'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sprak-robot
  cancel-in-progress: false

jobs:
  oversatt:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta repot
        uses: actions/checkout@v4

      - name: Kör språkroboten
        run: python3 .github/workflows/sprak-robot.py

      - name: Committa nya översättningar
        run: |
          set -euo pipefail
          git config user.name  "Språk-robot"
          git config user.email "actions@users.noreply.github.com"
          git add json/sprak/
          if git diff --cached --quiet; then
            echo "Inga nya fraser."
          else
            git commit -m "🌐 Språkrobot: nya förgenererade översättningar"
            git pull --rebase origin main || true
            git push
          fi
