# ============================================================
# PLATS: /.github/workflows/veckorapport.yml  (EXAKT denna sökväg krävs av GitHub Actions)
# ============================================================
# 📊 VECKORAPPORTEN (SPEC 245) – mejlar ägaren varje söndag kl
# ~08:00 svensk tid: veckans besök, köpklick, receptläge och
# ROBOTFLAGGORNA ur självläkningsloggen. Ändrar aldrig filer.
# ============================================================
name: Veckorapport (söndag)

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rapport:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta repot
        uses: actions/checkout@v4

      - name: Skicka veckorapporten
        run: python3 .github/workflows/veckorapport.py
