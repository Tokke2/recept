# ============================================================
# PLATS: /.github/workflows/sjalvlakning.yml  (EXAKT denna sökväg krävs av GitHub Actions)
# ============================================================
# 🩹 SJÄLVLÄKNINGSROBOT – Mitt Maskinkök
# ============================================================
# Gör sajten självstyrd: fyller i saknad effekt_w (reservtabell/
# typstandard), BERÄKNAR ENERGIDATA per recept automatiskt ur
# recept:maskiner-metan, rättar trasiga bildvägar och städar bort
# felplacerade sökmotor-verifieringsfiler ur recept/.
# Skriver ALDRIG över befintliga värden.
# Körs varje natt 04:15 UTC + vid push + manuellt.
# ============================================================
name: Självläkning (natt)

on:
  schedule:
    - cron: '15 4 * * *'
  push:
    paths:
      - 'recept/**.html'
      - 'json/maskiner/**.json'
      - 'json/matratter.json'   # 🍽️ ny maträtt → sidan byggs DIREKT (~30 sek)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sjalvlakning
  cancel-in-progress: false

jobs:
  laka:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta repot
        uses: actions/checkout@v4

      - name: Kör självläkningen
        run: python3 .github/workflows/sjalvlakning.py

      - name: Committa lagningar
        run: |
          set -euo pipefail
          git config user.name  "Läknings-robot"
          git config user.email "actions@users.noreply.github.com"
          git add -A json/ recept/ ratter/ backup/ sitemap.xml
          if git diff --cached --quiet; then
            echo "Allt friskt."
          else
            git commit -m "🩹 Självläkning: effekt/energi/bildvägar ($(date +%F))"
            # Krocktålig push: andra robotar kan pusha samtidigt → 3 försök med rebase
            for i in 1 2 3; do
              if git push; then exit 0; fi
              echo "Push-krock (försök $i) – hämtar om, kör om roboten mot färska main..."
              git fetch origin main
              git reset --hard origin/main
              python3 .github/workflows/sjalvlakning.py
              git add -A json/ recept/ ratter/ backup/ sitemap.xml
              if git diff --cached --quiet; then echo "Inget nytt efter omkörning."; exit 0; fi
              git commit -m "🩹 Självläkning: effekt/energi/bildvägar ($(date +%F))"
              sleep 5
            done
            echo "Gav upp efter 3 försök – nästa trigger tar det."; exit 1
          fi
